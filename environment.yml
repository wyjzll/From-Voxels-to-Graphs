name: liver-segmentation
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10

  # PyTorch with CUDA support
  - pytorch::pytorch=2.7.1
  - pytorch::pytorch-cuda=11.8
  - pytorch::torchvision=0.22.1
  - pytorch::torchaudio=2.7.1

  # Scientific computing
  - numpy=2.2.6
  - scipy=1.15.3
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - scikit-image=0.25.2

  # Medical imaging
  - nibabel=5.3.3
  - simpleitk=2.5.3

  # Visualization
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - pillow=12.0.0

  # Development tools
  - jupyter=1.0.0
  - ipython=8.30.0
  - pip=26.0.1

  # pip dependencies
  - pip
  - pip:
    - TotalSegmentator==2.12.0
    - monai==1.5.2
    - tqdm==4.67.3
    - PyYAML==6.0.3

# Install with: conda env create -f environment.yml
# Activate with: conda activate liver-segmentation
